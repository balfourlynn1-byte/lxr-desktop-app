name: JIMBONES C04 velocity scan host regression
on:
  push:
    branches:
      - agents/jb-wavetable-host-experiment
    paths:
      - 'Core/Inc/Soundengine/DSPAudio/JimbonesNativeWaveScan.h'
      - 'tests/test_c04_wave_velocity.c'
      - '.github/workflows/jb-c04-wave-velocity.yml'
      - 'Core/Src/Soundengine/DSPAudio/DrumVoice.c'
      - 'tests/test_c08_voice_local_scan_bank_source.py'
      - 'tests/test_c06_drum_scan_source.py'
      - 'tests/test_c09_wave_on_pcm.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  velocity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test bounded note-on velocity mapping
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mkdir -p build/host
          "$CC" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,float-cast-overflow -ICore/Inc tests/test_c04_wave_velocity.c -o build/host/test_c04_wave_velocity
          build/host/test_c04_wave_velocity
      - name: C05 native oscillator source guard
        run: python3 tests/test_c05_native_scan_source.py
      - name: C06 guarded drum routing source guard
        run: python3 tests/test_c06_drum_scan_source.py

      - name: C08 per-voice bank isolation source guard
        run: python3 tests/test_c08_voice_local_scan_bank_source.py

      - name: C09 C-kernel wavetable ON PCM variation
        env:
          CC: ${{ matrix.compiler }}
        run: |
          "$CC" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,float-cast-overflow -ICore/Inc tests/test_c09_wave_on_pcm.c -lm -o build/host/test_c09_wave_on_pcm
          build/host/test_c09_wave_on_pcm
