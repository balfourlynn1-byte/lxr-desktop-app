name: JB-24 Wavetable UI and Legacy-Kit Compatibility
on:
  push:
    branches:
      - agents/jb-24-wavetable-ui-v184
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect revision
        run: |
          git rev-parse HEAD
          echo 'JIMBONES v1.8.04 experimental UI, not hardware-validated'
      - name: Wave-only OSC menu fixture (GCC)
        run: sh tests/run_jb24_waveui.sh
      - name: Full host suite including 6-voice kit parity (GCC)
        run: sh tests/run_host.sh
      - name: Full host suite (Clang)
        env:
          CC: clang
        run: sh tests/run_host.sh
      - name: Existing step performance regression
        run: bash tests/run_combined_stepfx.sh
  arm-build:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Configure
        run: cmake --preset release
      - name: Build and retain memory log internally
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset release --parallel 2 2>&1 | tee build/release/arm-build.log
      - name: Strict ITCM margin (at least 512 bytes)
        run: python3 tests/check_jb22_memory.py build/release/arm-build.log
      - name: Image integrity only, no firmware publication
        run: |
          python3 tests/validate_image.py build/release/LXR_V2_V1.8.04.img --binary build/release/LXR_V2_STM32F765.bin
          sha256sum build/release/LXR_V2_V1.8.04.img
          echo 'Experimental candidate: do not flash without independent hardware acceptance.'
