name: JIMBONES native DrumVoice compile probe (host only)
on:
  push:
    branches:
      - agents/jb-wavetable-host-experiment
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drumvoice-host-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual DrumVoice.c native compilation (no ARM)
        run: |
          bash tests/run_native_drumvoice_probe.sh
